name: Lab8 Deployment Pipeline

on:
  push:
    branches:
      - Lab8/417477

jobs:
  unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        working-directory: env_417477
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        working-directory: env_417477
        run: |
          pytest main/calculator_test.py

  functional_tests:
    name: Run Functional Tests
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        working-directory: env_417477
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run app for functional tests
        working-directory: env_417477
        run: |
          nohup python main/app.py &

      - name: Wait for app to start
        run: |
          sleep 10

      - name: Run functional tests
        working-directory: env_417477
        run: |
          pytest main/app_test.py

  deployment:
    name: Build & Deploy Docker Image
    needs: functional_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME_417477 }} # Poprawiona nazwa sekretu dla użytkownika
          password: ${{ secrets.DOCKER_HUB_417477 }} # Poprawiona nazwa sekretu dla hasła/tokenu

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./env_417477
          file: ./env_417477/Dockerfile
          push: true
          # Używamy DOCKER_HUB_USERNAME_417477, ponieważ to jest Twoja nazwa użytkownika Docker Hub
          tags: ${{ secrets.DOCKER_HUB_USERNAME_417477 }}/lab8_417477:latest

      - name: Verify deployment
        run: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME_417477 }}/lab8_417477:latest
          docker run --rm ${{ secrets.DOCKER_HUB_USERNAME_417477 }}/lab8_417477:latest python -c "import app; print('Deployment successful')"