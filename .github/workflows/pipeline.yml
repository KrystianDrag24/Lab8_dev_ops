name: Lab8 Deployment Pipeline

on:
  push:
    branches:
      - Lab8/417477 

jobs:
  unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.3' 

      - name: Install dependencies
        working-directory: env_417477 
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: env_417477 
        run: |
          # Dodajemy bieżący katalog (env_417477) do PYTHONPATH
          # Moduł unittest będzie szukał testów w 'main' wewnątrz env_417477
          PYTHONPATH=$(pwd):$PYTHONPATH python3 -m unittest discover -s main

  functional_tests:
    name: Run Functional Tests
    needs: unit_tests 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.3' 

      - name: Install dependencies
        working-directory: env_417477
        run: |
          pip install -r requirements.txt

      - name: Run functional tests
        working-directory: env_417477
        run: |
          # Dodajemy bieżący katalog (env_417477) do PYTHONPATH
          # Moduł unittest będzie szukał testów w 'main' wewnątrz env_417477
          PYTHONPATH=$(pwd):$PYTHONPATH python3 -m unittest discover -s main

  deployment:
    name: Build & Deploy Docker Image
    needs: functional_tests 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_417477 }}" | docker login -u "${{ secrets.DOCKER_USERNAME_417477 }}" --password-stdin

      - name: Build Docker image
        working-directory: env_417477
        run: |
          # Budujemy obraz. Nazwa obrazu: twoja_nazwa_uzytkownika_docker_hub/lab8_417477
          docker build -t ${{ secrets.DOCKER_USERNAME_417477 }}/lab8_417477 .

      - name: Push Docker image
        run: |
          # Wypychamy zbudowany obraz do Docker Huba
          docker push ${{ secrets.DOCKER_USERNAME_417477 }}/lab8_417477